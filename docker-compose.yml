services:
  postgres:
    image: postgres:16-alpine
    container_name: livestock-trust-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-livestock_trust}
      POSTGRES_USER: ${POSTGRES_USER:-livestock_trust}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - livestock_trust_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-livestock_trust} -d ${POSTGRES_DB:-livestock_trust}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  livestock_trust_postgres_data:
    name: livestock_trust_postgres_data
